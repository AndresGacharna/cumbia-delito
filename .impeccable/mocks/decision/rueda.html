<!doctype html>
<html lang="es-CO"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;position:relative;background:
 repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.4) 26px 29px),
 repeating-linear-gradient(90deg,transparent 0 70px,rgba(0,0,0,.4) 70px 73px),#151931}
.band{position:absolute;width:1900px;height:700px;border-radius:50%;left:-230px;top:520px;background:#721D1F}
.band.g{background:#8B8D95;top:640px;opacity:.9}
.nav{position:absolute;top:24px;left:48px;right:48px;display:flex;justify-content:space-between;z-index:5;font-weight:800;font-size:13px;letter-spacing:.2em}
.nav b{font-family:'Kaushan Script';font-size:30px;font-weight:400;letter-spacing:0}
.nav i{color:#DA291C;font-style:normal}
/* the ring */
.ring{position:absolute;left:420px;top:90px;width:600px;height:600px;border-radius:50%;border:3px dashed rgba(255,255,255,.35);z-index:1}
.core{position:absolute;left:545px;top:200px;width:350px;height:380px;background:#fff;padding:14px 14px 54px;transform:rotate(2deg);z-index:3;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.core div{height:100%;background:linear-gradient(160deg,#1c2a6b,#0b0f22 60%,#3a0d16);display:flex;align-items:flex-end;padding:12px;font-size:13px;font-weight:800;letter-spacing:.15em;color:#8B8D95}
.logo{position:absolute;left:470px;top:470px;z-index:4;font-family:'Kaushan Script';font-size:120px;line-height:.85;transform:rotate(-7deg);text-shadow:0 6px 0 #0D1121}
.logo i{color:#DA291C;font-style:normal}
/* polaroids orbiting = sections */
.p{position:absolute;width:170px;background:#fff;padding:10px 10px 40px;z-index:2;color:#0D1121;box-shadow:0 10px 20px rgba(0,0,0,.5)}
.p div{height:150px;background:#0D1121}
.p span{position:absolute;bottom:10px;left:10px;font-weight:900;font-size:15px;letter-spacing:.14em}
.t{position:absolute;top:-12px;left:55px;width:70px;height:24px;background:rgba(233,228,218,.85)}
.tag{position:absolute;left:96px;top:250px;width:300px;font-weight:800;font-size:15px;letter-spacing:.22em;line-height:1.8;z-index:4}
.sub{position:absolute;left:96px;top:380px;width:320px;font-size:26px;font-weight:500;line-height:1.3;z-index:4}
.sub em{color:#DA291C;font-style:normal;font-weight:900}
.ctas{position:absolute;left:440px;top:760px;display:flex;gap:18px;z-index:5}
.ctas a{font-weight:900;letter-spacing:.16em;font-size:18px;padding:24px 34px}
.c1{background:#DA291C}.c2{background:#fff;color:#0D1121}
.plus{position:absolute;color:#DA291C;font-weight:900;font-size:60px;z-index:4}
</style></head><body>
<div class="band"></div><div class="band g"></div>
<nav class="nav"><b>Cumbia De<i>+</i>Lito</b><span>MÚSICA · COLABORACIONES · EL SHOW · ORGANIZADORES</span></nav>
<div class="ring"></div>
<div class="p" style="left:430px;top:110px;transform:rotate(-14deg)"><i class="t"></i><div></div><span>MÚSICA</span></div>
<div class="p" style="left:840px;top:100px;transform:rotate(12deg)"><i class="t"></i><div></div><span>KAROL G</span></div>
<div class="p" style="left:960px;top:360px;transform:rotate(8deg)"><i class="t"></i><div></div><span>EL SHOW</span></div>
<div class="p" style="left:1180px;top:200px;transform:rotate(-6deg);opacity:.55"><i class="t"></i><div></div><span>2012</span></div>
<div class="plus" style="left:1040px;top:600px">+</div><div class="plus" style="left:400px;top:600px">+</div>
<div class="core"><div>FOTO DE TARIMA</div></div>
<div class="logo">Cumbia<br>&nbsp;De<i>+</i>Lito</div>
<p class="tag">CUMBIA VILLERA<br>CUMBIA URBANA<br>BOGOTÁ, COLOMBIA</p>
<p class="sub">Tradición caribe colombiana <em>+</em> energía urbana latinoamericana.</p>
<div class="ctas"><a class="c1">CONTRATA EL SHOW</a><a class="c2">ESCÚCHANOS</a></div>
</body></html>
