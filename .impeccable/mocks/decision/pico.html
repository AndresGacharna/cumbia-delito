<!doctype html>
<html lang="es-CO"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;position:relative;background:
 repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.45) 26px 29px),
 repeating-linear-gradient(90deg,transparent 0 70px,rgba(0,0,0,.45) 70px 73px),#721D1F}
.nav{position:absolute;top:22px;left:48px;right:48px;display:flex;justify-content:space-between;z-index:5;font-weight:800;font-size:13px;letter-spacing:.2em}
.nav b{font-family:'Kaushan Script';font-size:28px;font-weight:400;letter-spacing:0}
.nav i{color:#DA291C;font-style:normal}
/* the sound system cabinet */
.cab{position:absolute;left:90px;right:90px;top:80px;bottom:30px;background:#0D1121;border:10px solid #151931;box-shadow:0 30px 60px rgba(0,0,0,.6);z-index:1}
.cab:before{content:"";position:absolute;left:0;right:0;top:170px;height:16px;background:repeating-linear-gradient(90deg,#DA291C 0 40px,#fff 40px 52px,#151931 52px 92px)}
.sign{position:absolute;left:0;right:0;top:20px;text-align:center;font-family:'Kaushan Script';font-size:118px;line-height:1;z-index:2;text-shadow:0 0 18px rgba(255,255,255,.55),0 0 2px #fff}
.sign i{color:#DA291C;font-style:normal;text-shadow:0 0 18px #DA291C}
.spk{position:absolute;top:230px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#151931 0 18%,#0D1121 19% 22%,#202750 23% 58%,#0D1121 59% 62%,#8B8D95 63% 66%,#151931 67%);z-index:2;display:flex;align-items:center;justify-content:center}
.spk a{position:absolute;bottom:-66px;font-weight:900;letter-spacing:.16em;font-size:20px;padding:22px 34px;white-space:nowrap}
.l{left:60px}.r{right:60px}
.l a{background:#fff;color:#0D1121}.r a{background:#DA291C}
.panel{position:absolute;left:510px;top:230px;width:400px;height:330px;background:#fff;padding:12px 12px 44px;z-index:2;transform:rotate(-2deg)}
.panel div{height:100%;background:linear-gradient(160deg,#1c2a6b,#0b0f22 60%,#3a0d16);display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:800;letter-spacing:.15em;color:#8B8D95}
.tape{position:absolute;top:-14px;left:150px;width:100px;height:28px;background:rgba(233,228,218,.85)}
.tag{position:absolute;left:0;right:0;top:600px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.24em;z-index:2}
.sub{position:absolute;left:470px;right:470px;top:640px;text-align:center;font-size:24px;font-weight:500;line-height:1.3;z-index:2}
.sub em{color:#DA291C;font-style:normal;font-weight:900}
.paint{position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(90deg,#151931 0 33%,#DA291C 33% 66%,#8B8D95 66%);z-index:1}
</style></head><body>
<nav class="nav"><b>Cumbia De<i>+</i>Lito</b><span>MÚSICA · KAROL G · EL SHOW · ORGANIZADORES</span></nav>
<div class="cab">
 <div class="sign">Cumbia De<i>+</i>Lito</div>
 <div class="spk l"><a>ESCÚCHANOS</a></div>
 <div class="spk r"><a>CONTRATA EL SHOW</a></div>
 <div class="panel"><span class="tape"></span><div>FOTO DE TARIMA</div></div>
 <p class="tag">CUMBIA VILLERA · CUMBIA URBANA · BOGOTÁ, COLOMBIA</p>
 <p class="sub">Tradición caribe colombiana <em>+</em> energía urbana latinoamericana.</p>
 <div class="paint"></div>
</div>
</body></html>
